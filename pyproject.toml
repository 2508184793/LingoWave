[project]
name = "lingowave"
version = "0.1.0"
description = "Windows 系统声音实时翻译与悬浮双语字幕"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["app*"]

[project.scripts]
lingowave = "app.main:main"
